<svg width="100%" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitetura de Data Lake do AgroSmart</title>
<desc>Fontes de dados estruturados e não estruturados alimentam as camadas bruta, confiável e refinada de um Data Lake, que por sua vez alimentam dashboards, IA generativa e alertas automáticos.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g><rect x="40" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Sensores IoT</text>
<text x="130" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Leituras em tempo real</text></g>
<g><rect x="240" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Imagens</text>
<text x="330" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Câmeras e drones</text></g>
<g><rect x="440" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">API externa</text>
<text x="530" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Clima e mercado</text></g>

<line x1="130" y1="96" x2="130" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="96" x2="330" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530" y1="96" x2="530" y2="156" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g><rect x="40" y="156" width="580" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="330" y="174" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#633806">Camada bruta (raw)</text>
<text x="330" y="192" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#854F0B">Dados originais, sem transformação</text></g>

<line x1="330" y1="212" x2="330" y2="272" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g><rect x="40" y="272" width="580" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="290" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Camada confiável (trusted)</text>
<text x="330" y="308" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Dados limpos, validados e integrados</text></g>

<line x1="330" y1="328" x2="330" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g><rect x="40" y="388" width="580" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="330" y="406" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489">Camada refinada (refined)</text>
<text x="330" y="424" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Pronta para análise e IA</text></g>

<line x1="130" y1="444" x2="130" y2="504" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="444" x2="330" y2="504" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530" y1="444" x2="530" y2="504" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g><rect x="40" y="504" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="522" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Dashboards e BI</text>
<text x="130" y="540" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Indicadores agregados</text></g>
<g><rect x="240" y="504" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330" y="522" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">IA generativa</text>
<text x="330" y="540" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Recomendações da IA</text></g>
<g><rect x="440" y="504" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="522" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Alertas automáticos</text>
<text x="530" y="540" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#444441">Ações recomendadas</text></g>
</svg>

<svg width="100%" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fluxo de ingestão de dados do AgroSmart</title>
<desc>Múltiplas fontes de dados são capturadas, validadas e armazenadas na camada bruta do Data Lake, sob um processo contínuo de manutenção e confiabilidade.</desc>

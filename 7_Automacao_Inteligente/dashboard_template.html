<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgroSmart - Painel de Monitoramento</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
h2 { font-size: 15px; margin: 32px 0 12px; font-weight: 600; }
.sub { color: var(--ink-2); margin: 0; }
.contexto { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; color: var(--ink-2); font-size: 13px; }
.contexto b { color: var(--ink); font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; }
.card .no { color: var(--muted); font-size: 12px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 2px 8px 2px 4px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
.badge i { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center;
  font-style: normal; font-size: 11px; color: #fff; }
.badge[data-n="NORMAL"] i { background: var(--good); }
.badge[data-n="ATENCAO"] i { background: var(--warning); color: #0b0b0b; }
.badge[data-n="ALTO"] i { background: var(--serious); color: #0b0b0b; }
.badge[data-n="CRITICO"] i { background: var(--critical); }
.leituras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 12px; }
.leituras div { font-size: 12px; color: var(--ink-2); }
.leituras b { display: block; font-size: 20px; font-weight: 600; color: var(--ink); }
.acoes { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--grid); }
.acoes li { padding: 8px 0 0; font-size: 13px; }
.acoes li span { color: var(--ink-2); display: block; }
.acoes .cmd { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--ink-2); }

.legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda svg { flex: none; }
.graficos { display: grid; gap: 12px; }
.grafico { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px 6px; position: relative; }
.grafico h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.grafico p { margin: 0; font-size: 12px; color: var(--muted); }
.grafico svg.plot { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.ref { fill: var(--ink-2); font-size: 11px; }
.fim { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 120px; }
.tooltip .h { color: var(--muted); margin-bottom: 4px; }
.tooltip .r { display: flex; align-items: center; gap: 8px; }
.tooltip .r b { font-variant-numeric: tabular-nums; min-width: 42px; }
.tooltip .r span { color: var(--ink-2); }

.tabela { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <h1>AgroSmart - Painel de monitoramento</h1>
  <p class="sub" id="sub"></p>
  <div class="contexto" id="contexto"></div>

  <h2>Situacao atual por talhao</h2>
  <div class="cards" id="cards"></div>

  <h2>Leituras dos sensores nas ultimas 24 h</h2>
  <div class="legenda" id="legenda"></div>
  <div class="graficos" id="graficos"></div>

  <h2>Linha do tempo de alertas automaticos</h2>
  <div class="tabela"><table id="alertas"></table></div>

  <details>
    <summary>Ver tabela de leituras (todas as series)</summary>
    <div class="tabela" style="margin-top:8px; max-height:420px; overflow:auto;"><table id="leituras"></table></div>
  </details>
</main>

<script>
const DADOS = /*__DADOS__*/null;

const NIVEL = {
  NORMAL:  { rotulo: "Normal",  icone: "✓" },
  ATENCAO: { rotulo: "Atencao", icone: "!" },
  ALTO:    { rotulo: "Alto",    icone: "▲" },
  CRITICO: { rotulo: "Critico", icone: "✖" },
};
const TALHOES = Object.keys(DADOS.series).sort();
const COR = { T1: "var(--s1)", T2: "var(--s2)", T3: "var(--s3)" };
const NOME = { T1: "T1 - irrigado", T2: "T2 - sequeiro", T3: "T3 - baixada" };
const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, texto) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (texto !== undefined) e.textContent = texto;
  return e;
}
function sv(tag, attrs = {}, texto) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (texto !== undefined) e.textContent = texto;
  return e;
}
function badge(nivel) {
  const b = el("span", { class: "badge", "data-n": nivel });
  b.append(el("i", { "aria-hidden": "true" }, NIVEL[nivel].icone), document.createTextNode(NIVEL[nivel].rotulo));
  return b;
}
function chaveLinha(cor) {
  const s = sv("svg", { width: 16, height: 4, "aria-hidden": "true" });
  s.append(sv("line", { x1: 0, y1: 2, x2: 16, y2: 2, stroke: cor, "stroke-width": 2, "stroke-linecap": "round" }));
  return s;
}

// ---- cabecalho
document.getElementById("sub").textContent =
  `Gerado em ${DADOS.gerado_em} pelo motor de decisao (motor_decisao.py)`;
const ext = DADOS.externo;
document.getElementById("sub").textContent += ` | Dados simulados de ${Object.values(DADOS.status)[0].ultima.slice(0, 10)}. Comandos em arquivo, sem atuacao fisica.`;
[["Chuva prevista (API)", ext.risco_chuva_previsto_pct + "%"],
 ["Max. prevista", ext.temp_max_prevista_c + " °C"],
 ["Focos fungicos nos diagnosticos", ext.focos_fungicos_ativos],
 ["Maior area afetada", ext.maior_area_afetada_pct + "%"]].forEach(([k, v]) => {
  const s = el("span", {}, k + ": "); s.append(el("b", {}, String(v)));
  document.getElementById("contexto").append(s);
});

// ---- cards
const cards = document.getElementById("cards");
for (const t of TALHOES) {
  const s = DADOS.status[t];
  const c = el("div", { class: "card" });
  const top = el("div", { class: "card-top" });
  const titulo = el("div");
  titulo.append(el("h3", {}, NOME[t] || t), el("div", { class: "no" }, `${s.no} · ultima leitura ${s.ultima.slice(11)}`));
  top.append(titulo, badge(s.nivel));
  const lt = el("div", { class: "leituras" });
  [["Solo", s.fatos.umidade_solo_pct + "%"], ["Temperatura", s.fatos.temperatura_c + " °C"],
   ["Umidade ar", s.fatos.umidade_ar_pct + "%"]].forEach(([k, v]) => {
    const d = el("div", {}, k); d.append(el("b", {}, v)); lt.append(d);
  });
  const ul = el("ul", { class: "acoes" });
  if (!s.acoes.length) ul.append(el("li", {}, "Sem alertas: manter monitoramento."));
  for (const a of s.acoes) {
    const li = el("li");
    li.append(el("strong", {}, a.mensagem), el("span", {}, a.recomendacao));
    if (a.comando) li.append(el("span", { class: "cmd" }, `comando simulado '${a.comando}' registrado para ${s.no}`));
    ul.append(li);
  }
  c.append(top, lt, ul);
  cards.append(c);
}

// ---- legenda (uma para os tres graficos)
const leg = document.getElementById("legenda");
for (const t of TALHOES) {
  const s = el("span"); s.append(chaveLinha(COR[t]), document.createTextNode(NOME[t] || t)); leg.append(s);
}

// ---- graficos de linha (small multiples, mesmo eixo X)
const GRAFICOS = [
  { campo: "solo", titulo: "Umidade do solo (%)", nota: "Linhas de referencia: 30% (solo seco) e 20% (critico)",
    min: 0, max: 100, passo: 25, refs: [[30, "seco"], [20, "critico"]], un: "%" },
  { campo: "temp", titulo: "Temperatura do ar (°C)", nota: "Linha de referencia: 32 °C (calor intenso)",
    min: 10, max: 40, passo: 10, refs: [[32, "calor"]], un: " °C" },
  { campo: "ur", titulo: "Umidade relativa do ar (%)", nota: "Linha de referencia: 85% (molhamento foliar)",
    min: 20, max: 100, passo: 20, refs: [[85, "molhamento"]], un: "%" },
];
const W = 1060, H = 200, M = { l: 36, r: 64, t: 10, b: 24 };
const x = m => M.l + (m / 1440) * (W - M.l - M.r);

for (const g of GRAFICOS) {
  const caixa = el("div", { class: "grafico" });
  caixa.append(el("h3", {}, g.titulo), el("p", {}, g.nota));
  const svg = sv("svg", { class: "plot", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": g.titulo });
  const y = v => M.t + (1 - (v - g.min) / (g.max - g.min)) * (H - M.t - M.b);

  for (let v = g.min; v <= g.max; v += g.passo) {
    svg.append(sv("line", { x1: M.l, x2: W - M.r, y1: y(v), y2: y(v), stroke: v === g.min ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
    svg.append(sv("text", { x: M.l - 6, y: y(v) + 4, "text-anchor": "end", class: "tick" }, v));
  }
  for (let h = 0; h <= 24; h += 3) {
    svg.append(sv("text", { x: x(h * 60), y: H - 6, "text-anchor": "middle", class: "tick" }, String(h).padStart(2, "0") + "h"));
  }
  for (const [v, rot] of g.refs) {
    svg.append(sv("line", { x1: M.l, x2: W - M.r, y1: y(v), y2: y(v), stroke: "var(--ink-2)", "stroke-width": 1, opacity: 0.55 }));
    svg.append(sv("text", { x: M.l + 4, y: y(v) - 4, class: "ref" }, `${v}${g.un.trim() === "%" ? "%" : ""} ${rot}`));
  }

  const usados = [];
  for (const t of TALHOES) {
    const pts = DADOS.series[t];
    const d = pts.map((p, i) => `${i ? "L" : "M"}${x(p.m).toFixed(1)},${y(p[g.campo]).toFixed(1)}`).join("");
    svg.append(sv("path", { d, fill: "none", stroke: COR[t], "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const u = pts[pts.length - 1];
    svg.append(sv("circle", { cx: x(u.m), cy: y(u[g.campo]), r: 4, fill: COR[t], stroke: "var(--surface)", "stroke-width": 2 }));
    const ly = y(u[g.campo]) + 4;
    if (usados.every(o => Math.abs(o - ly) >= 13)) {   // rotulo final so quando nao colide
      usados.push(ly);
      svg.append(sv("text", { x: x(u.m) + 8, y: ly, class: "fim" }, `${t} ${u[g.campo]}${g.un.trim() === "%" ? "%" : ""}`));
    }
  }

  // crosshair + tooltip
  const cruz = sv("line", { y1: M.t, y2: H - M.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  const marcadores = TALHOES.map(t => sv("circle", { r: 4, fill: COR[t], stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
  svg.append(cruz, ...marcadores);
  const area = sv("rect", { x: M.l, y: M.t, width: W - M.l - M.r, height: H - M.t - M.b, fill: "transparent", tabindex: 0 });
  svg.append(area);
  const tip = el("div", { class: "tooltip", hidden: "" });
  caixa.append(svg, tip);

  let foco = 48;
  function mostrar(minuto) {
    const slot = Math.round(minuto / 30) * 30;
    cruz.setAttribute("x1", x(slot)); cruz.setAttribute("x2", x(slot)); cruz.setAttribute("visibility", "visible");
    tip.replaceChildren(el("div", { class: "h" }, String(Math.floor(slot / 60)).padStart(2, "0") + ":" + String(slot % 60).padStart(2, "0")));
    TALHOES.forEach((t, i) => {
      const p = DADOS.series[t].find(q => q.m === slot);
      const r = el("div", { class: "r" });
      r.append(chaveLinha(COR[t]), el("b", {}, p ? p[g.campo] + g.un : "sem leitura"), el("span", {}, t));
      tip.append(r);
      if (p) { marcadores[i].setAttribute("cx", x(slot)); marcadores[i].setAttribute("cy", y(p[g.campo])); marcadores[i].setAttribute("visibility", "visible"); }
      else marcadores[i].setAttribute("visibility", "hidden");
    });
    tip.hidden = false;
    const box = svg.getBoundingClientRect(), esc = box.width / W;
    let left = x(slot) * esc + 14 + 14;
    if (left + tip.offsetWidth > caixa.clientWidth - 8) left = x(slot) * esc + 14 - tip.offsetWidth - 14;
    tip.style.left = left + "px"; tip.style.top = (svg.offsetTop + 8) + "px";
  }
  function esconder() { cruz.setAttribute("visibility", "hidden"); marcadores.forEach(m => m.setAttribute("visibility", "hidden")); tip.hidden = true; }
  area.addEventListener("pointermove", ev => {
    const box = svg.getBoundingClientRect();
    const px = (ev.clientX - box.left) * (W / box.width);
    mostrar(Math.max(0, Math.min(1410, ((px - M.l) / (W - M.l - M.r)) * 1440)));
  });
  area.addEventListener("pointerleave", esconder);
  area.addEventListener("focus", () => mostrar(foco * 30 > 1410 ? 1410 : foco * 30));
  area.addEventListener("blur", esconder);
  area.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight") foco = Math.min(47, foco + 1);
    else if (ev.key === "ArrowLeft") foco = Math.max(0, foco - 1);
    else return;
    ev.preventDefault(); mostrar(foco * 30);
  });
  document.getElementById("graficos").append(caixa);
}

// ---- tabela de alertas
const ta = document.getElementById("alertas");
const cab = el("tr");
["Hora", "Talhao", "Nivel", "Alerta", "Acao recomendada", "Regras"].forEach(h => cab.append(el("th", {}, h)));
ta.append(cab);
for (const a of DADOS.alertas) {
  const tr = el("tr");
  const tdN = el("td"); tdN.append(badge(a.nivel));
  tr.append(el("td", { class: "num" }, a.data_hora.slice(11)), el("td", {}, a.talhao), tdN,
    el("td", {}, a.mensagem), el("td", {}, a.recomendacao + (a.comando ? ` [comando '${a.comando}']` : "")),
    el("td", { class: "num" }, a.evidencias.join(", ")));
  ta.append(tr);
}

// ---- tabela de leituras
const tl = document.getElementById("leituras");
const c2 = el("tr");
["Hora", ...TALHOES.flatMap(t => [`${t} solo`, `${t} temp`, `${t} UR`])].forEach(h => c2.append(el("th", {}, h)));
tl.append(c2);
for (let m = 0; m < 1440; m += 30) {
  const tr = el("tr");
  tr.append(el("td", { class: "num" }, String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0")));
  for (const t of TALHOES) {
    const p = DADOS.series[t].find(q => q.m === m);
    tr.append(el("td", { class: "num" }, p ? p.solo + "%" : "-"), el("td", { class: "num" }, p ? p.temp : "-"),
      el("td", { class: "num" }, p ? p.ur + "%" : "-"));
  }
  tl.append(tr);
}
</script>
</body>
</html>
